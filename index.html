<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diverty · Operación Navidad</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7E1120" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>html,body,#root{margin:0;min-height:100%;background:#F4F5F7}body{overscroll-behavior:none;font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>

  <!-- Icono -->
  <link rel="icon" href="/icon-192.png" />

  <!-- iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Navidad Diverty" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>

<body>
  <div id="root"></div>

  <!-- React -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('Service Worker registrado:', registration);
          })
          .catch(function (error) {
            console.log('Error al registrar SW:', error);
          });
      });
    }
  </script>
</body>
</html>
